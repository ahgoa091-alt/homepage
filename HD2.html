<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="HD2.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <img src="img/It.png" alt="شعار الكلية" />
      </div>
      <h2>الزبون</h2>
    </nav>
    <br />
    <br />
    <div align="center">
      <button class="ok">تأكيد الطلب</button>
      <button class="del">حذف المحدد</button>
    </div>

    <div id="popupDel" class="popup hidden">
      <div class="popup-content">
        <h3>هل أنت متأكد من حذف الطلبات؟</h3>
        <div class="popup-buttons">
          <button id="confirmDel">تأكيد</button>
          <button id="cancelDel">إلغاء</button>
        </div>
      </div>
    </div>

    <div id="popupOrder" class="popup hidden">
      <div class="popup-content large">
        <h3>تأكيد الطلب</h3>
        <label>اسم الزبون:</label>
        <input type="text" id="customerName" placeholder="اكتب اسمك هنا..." />
        <table id="orderTable">
          <thead>
            <tr>
              <th>العنصر</th>
              <th>الكمية</th>
              <th>السعر</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="total">الإجمالي: <span id="totalPrice">0</span> د.ل</p>
        <div class="popup-buttons">
          <button id="confirmOrder">تأكيد</button>
          <button id="cancelOrder">إلغاء</button>
        </div>
      </div>
    </div>

    <div class="products-container">
      <div class="product-card">
        <img src="img/cafe.jpeg" class="product-img" alt="coffee" />
        <h3 class="product-title">قهوة عربية سادة</h3>
        <p class="product-price">5 د.ل</p>
        <input type="number" id="num" name="num" min="0" max="50" value="0" />
      </div>

      <div class="product-card">
        <img src="img/cafetur.jpeg" class="product-img" alt="coffee" />
        <h3 class="product-title">قهوة تركية</h3>
        <p class="product-price">7 د.ل</p>
        <input type="number" id="num" name="num" min="0" max="50" value="0" />
      </div>

      <div class="product-card">
        <img src="img/cafetur.jpeg" class="product-img" alt="coffee" />
        <h3 class="product-title">قهوة تركية</h3>
        <p class="product-price">7 د.ل</p>
        <input type="number" id="num" name="num" min="0" max="50" value="0" />
      </div>
    </div>
    <footer>
      <br />
      &copy;2025
      <br />
      <p>تحت إشراف : عصام الأسطى</p>
      <br />
    </footer>

</html>
